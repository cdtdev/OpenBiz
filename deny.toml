# Licence policy — enforces CLAUDE.md §5.
#
# If CI fails here because a new dependency carries a forbidden licence, REMOVE THE DEPENDENCY.
# Do not add an exception to make the build pass. The open-core model depends on the core staying
# cleanly relicensable, and a single GPL/AGPL transitive dep breaks that.

[licenses]
version = 2
# Permissive only. Deliberately excludes GPL, LGPL, AGPL, SSPL, and source-available licences.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9
# The allow list above is aspirational — it covers licences we will accept as the dependency tree
# grows. Do not prune it to match today's tree; that would just churn every time a crate is added.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# Wildcard versions are banned for external crates: an unpinned third-party dependency can change
# licence or behaviour underneath us.
wildcards = "deny"
# ...but our own `crates/*` are path dependencies, which cargo resolves as `*` by definition.
# Without this, the policy fails on the workspace's internal wiring rather than on a real risk.
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
