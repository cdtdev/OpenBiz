name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  licences:
    name: Licence policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Enforces CLAUDE.md §5. If this fails on a new dependency, remove the dependency —
      # do not loosen deny.toml.
      #
      # Installed onto the normal runner rather than using cargo-deny-action: that action runs in a
      # musl container which does not honour our rust-toolchain.toml, and the resulting toolchain
      # mismatch made cargo-deny fail to resolve workspace dependency inheritance.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - run: cargo deny check licenses bans sources

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
