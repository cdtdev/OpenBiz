name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The embedded store compiles RocksDB from source and generates its bindings with
      # bindgen, which needs a C++ toolchain and libclang. `ubuntu-latest` ships both, but
      # adr/0006 requires us not to *implicitly* rely on that — a base-image change must read
      # as "the toolchain is missing", not as an unexplained bindgen panic several steps later.
      #
      # So: verify first, install only when genuinely absent, and assert the result either way.
      # The install is bounded and retried because it is the one unavoidable network call in a
      # *required* status check, and an unbounded `apt-get update` against a stalled mirror
      # leaves that check pending forever — which branch protection reads as "not yet passed",
      # never as a failure, so the PR blocks with nothing to go and read. Bounded means a bad
      # mirror turns the build red in minutes instead of hanging it. See the step timeout below
      # and the job-level `timeout-minutes`.
      - name: Install the store's build toolchain
        timeout-minutes: 6
        run: |
          set -euo pipefail

          # Mirrors what bindgen itself searches for, so a pass here means bindgen will find it.
          have_toolchain() {
            command -v clang >/dev/null 2>&1 \
              && { ls /usr/lib/llvm-*/lib/libclang.so* >/dev/null 2>&1 \
                || ls /usr/lib/x86_64-linux-gnu/libclang*.so* >/dev/null 2>&1; }
          }

          if have_toolchain; then
            echo "clang and libclang are already present on the runner image; skipping apt"
          else
            echo "libclang not found on the image; installing it"
            installed=
            for attempt in 1 2 3; do
              if sudo apt-get update -o Acquire::Retries=3 \
                && sudo apt-get install -y --no-install-recommends clang libclang-dev; then
                installed=yes
                break
              fi
              echo "::warning::apt attempt $attempt failed; retrying" >&2
              sleep 5
            done
            if [ -z "$installed" ]; then
              echo "::error::could not install clang/libclang after 3 attempts" >&2
              exit 1
            fi
          fi

          # adr/0006: a missing toolchain is a red build with a named cause, never a mystery.
          if ! have_toolchain; then
            echo "::error::clang/libclang still absent after install; the store cannot build" >&2
            exit 1
          fi
          clang --version | head -1

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      # `ui/dist` is embedded into the binary at compile time, so the Rust suite needs it present
      # to assert against the real Vite output rather than build.rs's placeholder.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the UI for embedding
        working-directory: ui
        run: npm ci && npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  licences:
    name: Licence policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Enforces CLAUDE.md §5. If this fails on a new dependency, remove the dependency —
      # do not loosen deny.toml.
      #
      # Installed onto the normal runner rather than using cargo-deny-action: that action runs in a
      # musl container which does not honour our rust-toolchain.toml, and the resulting toolchain
      # mismatch made cargo-deny fail to resolve workspace dependency inheritance.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - run: cargo deny check licenses bans sources

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run typecheck

      # Vitest exits non-zero when it finds no test files (`passWithNoTests: false` in
      # vite.config.ts states it rather than leaning on the default). Deleting the suite therefore
      # turns this job red instead of quietly leaving a green step that asserts nothing.
      - run: npm test

      - run: npm run build

  single-binary:
    name: Single binary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The embedded store compiles RocksDB from source and generates its bindings with
      # bindgen, which needs a C++ toolchain and libclang. `ubuntu-latest` ships both, but
      # adr/0006 requires us not to *implicitly* rely on that — a base-image change must read
      # as "the toolchain is missing", not as an unexplained bindgen panic several steps later.
      #
      # So: verify first, install only when genuinely absent, and assert the result either way.
      # The install is bounded and retried because it is the one unavoidable network call in a
      # *required* status check, and an unbounded `apt-get update` against a stalled mirror
      # leaves that check pending forever — which branch protection reads as "not yet passed",
      # never as a failure, so the PR blocks with nothing to go and read. Bounded means a bad
      # mirror turns the build red in minutes instead of hanging it. See the step timeout below
      # and the job-level `timeout-minutes`.
      - name: Install the store's build toolchain
        timeout-minutes: 6
        run: |
          set -euo pipefail

          # Mirrors what bindgen itself searches for, so a pass here means bindgen will find it.
          have_toolchain() {
            command -v clang >/dev/null 2>&1 \
              && { ls /usr/lib/llvm-*/lib/libclang.so* >/dev/null 2>&1 \
                || ls /usr/lib/x86_64-linux-gnu/libclang*.so* >/dev/null 2>&1; }
          }

          if have_toolchain; then
            echo "clang and libclang are already present on the runner image; skipping apt"
          else
            echo "libclang not found on the image; installing it"
            installed=
            for attempt in 1 2 3; do
              if sudo apt-get update -o Acquire::Retries=3 \
                && sudo apt-get install -y --no-install-recommends clang libclang-dev; then
                installed=yes
                break
              fi
              echo "::warning::apt attempt $attempt failed; retrying" >&2
              sleep 5
            done
            if [ -z "$installed" ]; then
              echo "::error::could not install clang/libclang after 3 attempts" >&2
              exit 1
            fi
          fi

          # adr/0006: a missing toolchain is a red build with a named cause, never a mystery.
          if ! have_toolchain; then
            echo "::error::clang/libclang still absent after install; the store cannot build" >&2
            exit 1
          fi
          clang --version | head -1

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Build the release binary
        run: cargo build --release --bin openbiz

      # The non-negotiable in CLAUDE.md §1 is that the binary is self-contained. Deleting the
      # build artefacts it was compiled from and *then* asking it to serve the interface is the
      # only check that actually proves it, rather than proving the filesystem still has a copy.
      - name: Delete the UI build artefacts
        run: rm -rf ui/dist ui/node_modules

      - name: Serve the UI from the binary alone
        run: |
          set -euo pipefail
          ./target/release/openbiz &
          server=$!
          trap 'kill "$server"' EXIT

          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done

          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'

          shell=$(curl -fsS http://127.0.0.1:8080/)
          echo "$shell"
          echo "$shell" | grep -q 'id="root"'

          if echo "$shell" | grep -q 'UI not built'; then
            echo "::error::the binary shipped build.rs's placeholder, not the real UI" >&2
            exit 1
          fi
