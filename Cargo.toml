[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/cdtdev/OpenBiz"
authors = ["OpenBiz contributors"]
# OpenBiz ships as an application, not as crates.io libraries. This also lets cargo-deny's
# `allow-wildcard-paths` apply — it deliberately does not exempt publishable crates, since
# crates.io forbids path dependencies.
publish = false

[workspace.dependencies]
openbiz-api = { path = "crates/openbiz-api" }
openbiz-git = { path = "crates/openbiz-git" }
openbiz-owl = { path = "crates/openbiz-owl" }
openbiz-skos = { path = "crates/openbiz-skos" }
openbiz-store = { path = "crates/openbiz-store" }
openbiz-validate = { path = "crates/openbiz-validate" }

anyhow = "1"
axum = "0.8"
http-body-util = "0.1"
mime_guess = "2"
# `debug-embed` makes debug builds embed rather than read `ui/dist` from disk, so the tests prove
# the binary is self-contained instead of proving the filesystem works (CLAUDE.md §1). See ADR 0004.
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# Configuration file format. TOML over JSON because a deployment's config file is where operators
# leave notes for the next operator, and over YAML because significant whitespace is a footgun in
# a file a human hand-edits under pressure. Spans in its errors are what let us point at the line
# an unrecognised key is on. See docs/CONFIGURATION.md.
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
