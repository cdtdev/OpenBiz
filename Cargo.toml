[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/cdtdev/OpenBiz"
authors = ["OpenBiz contributors"]
# OpenBiz ships as an application, not as crates.io libraries. This also lets cargo-deny's
# `allow-wildcard-paths` apply — it deliberately does not exempt publishable crates, since
# crates.io forbids path dependencies.
publish = false

[workspace.dependencies]
openbiz-api = { path = "crates/openbiz-api" }
openbiz-discovery = { path = "crates/openbiz-discovery" }
openbiz-git = { path = "crates/openbiz-git" }
openbiz-owl = { path = "crates/openbiz-owl" }
openbiz-skos = { path = "crates/openbiz-skos" }
openbiz-store = { path = "crates/openbiz-store" }
openbiz-validate = { path = "crates/openbiz-validate" }

anyhow = "1"
axum = "0.8"
http-body-util = "0.1"
mime_guess = "2"
# Embedded RDF store and SPARQL engine. `default-features = false` with only `rocksdb` enabled
# keeps the `http-client` feature family out of the tree: an air-gapped deployment (CLAUDE.md §1.1)
# must not carry a code path that can open an outbound connection. Building it requires a C++20
# compiler and libclang — see docs/adr/0006 and README.md.
oxigraph = { version = "0.5", default-features = false, features = ["rocksdb"] }
# XSD datatypes, for the `xsd:dateTime` a migration record is stamped with. Already in the tree —
# Oxigraph's own term model is built on it — so depending on it directly adds a manifest line and
# no supply-chain surface. Formatting a timestamp by hand would mean hand-rolling civil-date
# arithmetic to produce a lexical form the store must then agree with; using the same library the
# store's literals go through means it agrees by construction. MIT OR Apache-2.0.
oxsdatatypes = "0.2"
# `debug-embed` makes debug builds embed rather than read `ui/dist` from disk, so the tests prove
# the binary is self-contained instead of proving the filesystem works (CLAUDE.md §1). See ADR 0004.
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `application/x-www-form-urlencoded`, for the SPARQL protocol's POST form. Already in the
# tree — axum's `Query` and `Form` extractors are built on it — so depending on it directly
# adds a manifest line and no supply-chain surface. Using the *same* decoder for the URL
# query string and for a form body is the point: SPARQL 1.1 Protocol defines both, and two
# decoders would eventually disagree about a `+`, a `%`, or a repeated key.
serde_urlencoded = "0.7"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# Configuration file format. TOML over JSON because a deployment's config file is where operators
# leave notes for the next operator, and over YAML because significant whitespace is a footgun in
# a file a human hand-edits under pressure. Spans in its errors are what let us point at the line
# an unrecognised key is on. See docs/CONFIGURATION.md.
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
